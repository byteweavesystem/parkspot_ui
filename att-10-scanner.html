<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ATT-10 Scanner — ParkSpot</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .cam {
      position:absolute; inset:0; bottom:210px;
      background:
        radial-gradient(circle at 50% 42%, transparent 28%, rgba(15,23,42,.55) 70%),
        linear-gradient(160deg, #1E293B, #0F172A 50%, #134E4A);
    }
    .reticle {
      position:absolute; left:50%; top:42%; transform:translate(-50%,-50%);
      width: 220px; height: 220px; border: 2px solid rgba(16,185,129,.9);
      border-radius: 24px; box-shadow: 0 0 0 9999px rgba(15,23,42,.45), 0 0 24px rgba(16,185,129,.45);
    }
    .reticle::before {
      content:""; position:absolute; left:12px; right:12px; height:2px; top:40%;
      background: linear-gradient(90deg, transparent, #34D399, transparent);
      animation: sweep 2s ease-in-out infinite;
    }
    @keyframes sweep { 0%{top:18%} 50%{top:78%} 100%{top:18%} }
    .telemetry {
      position:absolute; top:54px; left:12px; right:12px; z-index:5;
      display:flex; flex-wrap:wrap; gap:6px;
    }
    .chip {
      background: rgba(15,23,42,.75); color:#E2E8F0; border:1px solid rgba(255,255,255,.12);
      border-radius:8px; padding:6px 8px; font-size:10px; font-weight:700; backdrop-filter:blur(8px);
    }
    .chip.warn { background: rgba(180,83,9,.85); border-color: rgba(253,230,138,.4); color:#FEF3C7; }
    .result {
      position:absolute; left:0; right:0; bottom:0; height:210px; background:#fff;
      border-radius: 24px 24px 0 0; padding: 16px 16px 28px;
      box-shadow: 0 -8px 32px rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone" style="background:#0F172A;">
      <div class="status-bar light"><span>9:41</span><span>88% ▮▮▮</span></div>
      <div class="cam">
        <div class="telemetry">
          <span class="chip">POS-04</span>
          <span class="chip">Ramesh Kumar #B409</span>
          <span class="chip warn">OFFLINE · Ed25519 LOCAL</span>
          <span class="chip">Manifest 11h 40m</span>
          <span class="chip">Printer OK</span>
        </div>
        <div class="reticle"></div>
        <div style="position:absolute;bottom:24px;left:16px;right:16px;display:flex;justify-content:space-between;">
          <div style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;font-weight:800;">🔦</div>
          <div style="height:48px;padding:0 16px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;font-size:12px;font-weight:700;">Plate / code lookup</div>
        </div>
      </div>
      <div class="result">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span class="pill ok">PASS VERIFIED · 180ms</span>
          <span class="pill info">BARRIER OPENING</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div class="hsrp-inline plate" style="font-size:18px;font-weight:800;">KA 01 MJ 8821</div>
            <div class="meta" style="margin-top:4px;">Car · Bay B2-19 · 18:00–20:00</div>
            <div class="meta">Plate match · nonce burned locally</div>
          </div>
          <div style="text-align:right;">
            <div class="label">BOOKING</div>
            <div class="h3">#SP-99214</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1.4fr .8fr;gap:10px;margin-top:14px;">
          <button class="btn primary xl">Confirm & open barrier</button>
          <button class="btn secondary">Override…</button>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
</body>
</html>
